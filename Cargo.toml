[package]
name = "kiri"
version = "0.1.0"
edition = "2021"
authors = ["Manu <manu.crumbled@gmail.com>"]
description = "A lightweight Windows desktop app that cuts doomscrolling tabs with a pixel cat"

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
] }
uiautomation = "0.25"
serde = { version = "1.0", features = ["derive"] }
png = "0.17"

[build-dependencies]
winresource = "0.1"
